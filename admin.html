
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração | Arte Black</title>

    <link rel="stylesheet" href="admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- LOGIN ADMINISTRATIVO -->
    <section id="login-section" class="login-section">

        <div class="login-box">

            <h1>ARTE <span>BLACK</span></h1>

            <p>Painel Administrativo</p>

            <form id="login-form">

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="password">Senha</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

                <p id="login-message"></p>

            </form>

        </div>

    </section>


    <!-- PAINEL ADMINISTRATIVO -->
    <main id="admin-section" hidden>

        <header class="admin-header">

            <div>
                <h1>ARTE <span>BLACK</span></h1>
                <p>Painel Administrativo</p>
            </div>

            <button id="logout-button" type="button">
                Sair
            </button>

        </header>


        <section class="admin-content">

            <div class="welcome">
                <h2>Gerenciar produtos</h2>
                <p>Cadastre, edite e controle seus produtos.</p>
            </div>


            <!-- FORMULÁRIO DE PRODUTOS -->
            <section class="product-form-section">

                <h2 id="form-title">Adicionar produto</h2>

                <form id="product-form">

                    <input type="hidden" id="product-id">

                    <label for="product-name">Nome do produto</label>
                    <input
                        type="text"
                        id="product-name"
                        required
                    >

                    <label for="product-category">Categoria</label>
                    <input
                        type="text"
                        id="product-category"
                        required
                    >

                    <label for="product-description">Descrição</label>
                    <textarea
                        id="product-description"
                        rows="4"
                    ></textarea>

                    <label for="product-price">Preço (R$)</label>
                    <input
                        type="number"
                        id="product-price"
                        min="0"
                        step="0.01"
                        required
                    >

                    <label for="product-quantity">Quantidade em estoque</label>
                    <input
                        type="number"
                        id="product-quantity"
                        min="0"
                        step="1"
                        required
                    >

                    <label for="product-image">Foto do produto</label>
                    <input
                        type="file"
                        id="product-image"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <label class="active-label">
                        <input
                            type="checkbox"
                            id="product-active"
                            checked
                        >
                        Produto ativo
                    </label>

                    <button type="submit" id="save-product-button">
                        Salvar produto
                    </button>

                    <button type="button" id="cancel-edit-button" hidden>
                        Cancelar edição
                    </button>

                    <p id="product-message"></p>

                </form>

            </section>


            <!-- LISTA DE PRODUTOS -->
            <section class="products-section">

                <h2>Produtos cadastrados</h2>

                <div id="products-list">
                    <p>Carregando produtos...</p>
                </div>

            </section>

        </section>

    </main>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- JAVASCRIPT DO PAINEL -->
    <script src="admin.js"></script>

</body>
</html>
